name: Build and Push to ACR

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-zavastore-dev-westus3
  ACR_NAME: acrzavastoredewwestus3
  IMAGE_NAME: zavastore

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR name from resource group
        id: get-acr
        run: |
          ACR_NAME=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "ACR Name: $ACR_NAME"

      - name: Set image tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ steps.get-acr.outputs.acr_name }} \
            --image ${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --file src/Dockerfile \
            src/

      - name: Update Web App to use new image
        run: |
          WEB_APP_NAME=$(az webapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          az webapp config container set \
            --name $WEB_APP_NAME \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ steps.get-acr.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
          
          echo "Web App updated: $WEB_APP_NAME"
          
          # Restart the web app to ensure new image is pulled
          az webapp restart \
            --name $WEB_APP_NAME \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Output deployment info
        run: |
          WEB_APP_NAME=$(az webapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          WEB_APP_URL=$(az webapp show --name $WEB_APP_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "defaultHostName" -o tsv)
          echo "::notice::Application deployed to https://$WEB_APP_URL"
